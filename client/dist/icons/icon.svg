<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Background with Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Target Rings -->
  <g filter="url(#shadow)" transform="translate(256, 220)">
    <!-- Outer Ring -->
    <circle r="140" fill="#ffffff" opacity="0.95" />
    <!-- Middle Ring -->
    <circle r="105" fill="url(#bgGrad)" />
    <!-- Inner Ring -->
    <circle r="70" fill="#ffffff" />
    <!-- Bullseye Center -->
    <circle r="40" fill="url(#targetGrad)" />
    
    <!-- Arrow Accent -->
    <path d="M 60 -60 L 0 0" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />
    <polygon points="50,-80 80,-80 80,-50" fill="#f59e0b" />
  </g>

  <!-- App Title Banner -->
  <rect x="76" y="390" width="360" height="72" rx="36" fill="#ffffff" opacity="0.95" filter="url(#shadow)" />
  
  <text x="256" y="438" font-family="'Noto Sans Gujarati', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#064e3b" text-anchor="middle">
    નિપુણ ગુજરાત
  </text>
</svg>
